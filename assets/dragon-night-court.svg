<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" role="img" aria-label="Night Court divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#70A9D6" stop-opacity="0"/><stop offset="1" stop-color="#70A9D6"/></linearGradient>
    <linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#70A9D6"/><stop offset="1" stop-color="#70A9D6" stop-opacity="0"/></linearGradient>
    <path id="star" d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5Z"/>
  </defs>
  <rect x="40" y="39" width="320" height="1.5" fill="url(#l)"/>
  <rect x="440" y="39" width="320" height="1.5" fill="url(#r)"/>
  <!-- crescent moon -->
  <path d="M404 22 A18 18 0 1 0 404 58 A13 13 0 1 1 404 22Z" fill="#70A9D6"/>
  <!-- three stars -->
  <use href="#star" x="418" y="28" fill="#B03A52"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></use>
  <use href="#star" x="430" y="40" fill="#B03A52"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></use>
  <use href="#star" x="418" y="52" fill="#B03A52"><animate attributeName="opacity" values="1;.3;1" dur="3s" begin="1s" repeatCount="indefinite"/></use>
  <!-- scattered stars -->
  <circle cx="300" cy="30" r="1.5" fill="#70A9D6"/><circle cx="240" cy="50" r="1.2" fill="#70A9D6"/>
  <circle cx="500" cy="28" r="1.5" fill="#70A9D6"/><circle cx="560" cy="52" r="1.2" fill="#70A9D6"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
